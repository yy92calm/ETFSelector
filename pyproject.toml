[project]
name = "etfselector"
version = "0.1.0"
description = "智能ETF选择系统 - 提供ETF行情分析、虚拟交易和策略回测功能"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.30.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
data = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]
scheduler = [
    "apscheduler>=3.10.0",
]
