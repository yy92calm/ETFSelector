[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-selector"
version = "0.3.0"
description = "ETF配置组合系统 - 智能配置、自动再平衡、回测验证"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "efinance>=0.4",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "apscheduler>=3.10.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
