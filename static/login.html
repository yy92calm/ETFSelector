<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - ETF智能工作台</title>
    <style>
        :root {
            --bg-primary: #f4f6f9;
            --bg-card: #ffffff;
            --text-primary: #1c2b3a;
            --text-secondary: #5c6f82;
            --accent: #0284c7;
            --border: #dfe6ee;
            --danger: #dc2626;
            --radius: 8px;
            --shadow-md: 0 4px 16px rgba(28, 43, 58, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 40px 36px;
            width: 360px;
            text-align: center;
        }
        .login-card h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .login-card p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }
        .login-card input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }
        .login-card input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .login-card button {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-card button:hover { opacity: 0.9; }
        .login-error {
            margin-top: 12px;
            font-size: 13px;
            color: var(--danger);
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>ETF 智能工作台</h1>
        <p>请输入访问密码</p>
        <input type="password" id="login-password" placeholder="密码" autocomplete="current-password">
        <button id="login-submit">进入</button>
        <div id="login-error" class="login-error"></div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
