<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能ETF选择系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>智能ETF选择系统</h1>
            <nav>
                <ul>
                    <li><a href="#home">首页</a></li>
                    <li><a href="#quotation">行情</a></li>
                    <li><a href="#analysis">分析</a></li>
                    <li><a href="#trade">交易</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="home" class="section active">
                <h2>欢迎使用智能ETF选择系统</h2>
                <p>系统提供最新的ETF行情数据、技术指标分析和虚拟交易功能。</p>
                <div id="api-status">
                    <p>API 状态: <span id="status-indicator">检查中...</span></p>
                </div>
            </section>

            <section id="quotation" class="section">
                <h2>ETF行情</h2>
                <div class="quote-controls">
                    <input type="text" id="etf-code" placeholder="输入ETF代码 (如: sh510050)" value="sh510050">
                    <button onclick="fetchQuote()">获取行情</button>
                </div>
                <div id="quote-result" class="quote-result"></div>
            </section>

            <section id="analysis" class="section">
                <h2>技术分析</h2>
                <p>技术指标分析功能开发中...</p>
            </section>

            <section id="trade" class="section">
                <h2>虚拟交易</h2>
                <p>虚拟交易功能开发中...</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 智能ETF选择系统. 版本 0.1.0</p>
        </footer>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
